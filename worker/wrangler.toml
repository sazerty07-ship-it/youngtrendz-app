name = "youngtrendz-app"
main = "src/index.js"
compatibility_date = "2026-11-06"
workers_dev = true
keep_vars = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/health"]

[triggers]
crons = ["0 5 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "youngtrendz-tracker"
database_id = "87dd454a-7dee-4592-8362-7a3ffdcf6061"
migrations_dir = "migrations"

[observability]
enabled = true

# Configure these as encrypted Secrets in Cloudflare:
# BOL_CLIENT_ID
# BOL_CLIENT_SECRET
# APP_ACCESS_TOKEN
