name = "youngtrendz-app"
main = "src/index.js"
compatibility_date = "2026-11-06"
workers_dev = true
keep_vars = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/health"]

[triggers]\ncrons = ["0 5 * * *"]\n\n[observability]
enabled = true

# Configure these as encrypted Secrets in Cloudflare:
# BOL_CLIENT_ID
# BOL_CLIENT_SECRET
# APP_ACCESS_TOKEN
